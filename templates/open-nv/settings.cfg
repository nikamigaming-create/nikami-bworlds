# Packaged OpenNV defaults. Generated campaign profiles copy this once and then
# keep it profile-local, so a user's settings never alter game or mod sources.

[Camera]
field of view = 75
viewing distance = 65536

[Video]
resolution x = 1920
resolution y = 1080
# Opening proofs must remain drawable without asking Windows to foreground the
# game. This keeps the exact-title recorder from receiving a minimized surface.
window mode = 2
window border = true
minimize on focus loss = false
vsync mode = 1

[Input]
always run = true

[Map]
global = true
local map hud fog of war = false

[Saves]
character = OpenNV

[Models]
# Fallout 3/New Vegas use Bethesda's 20.2.0.7 NIF family. The OpenNV runtime
# has a guarded reader for that family, so enable it only in generated OpenNV
# profiles rather than changing a global OpenMW installation.
load unsupported nif files = true

[Water]
# Fallout does not ship OpenMW's legacy animated Morrowind water frames.  Use
# the renderer's shader-water path, whose normal map is bundled with OpenMW,
# instead of allowing the legacy path to resolve those absent textures as
# magenta fallback images.
shader = true

[OpenNV Compatibility]
# Generated campaign profiles add data-declared aliases here. The engine only
# accepts named semantic capabilities, never arbitrary native code.
script command mappings = ShowLoveTesterMenuParams:character-special
# Fallout profiles do not mount Morrowind's legacy UI art. During loading, let
# the native fallback skin settle before the generic input focus path runs.
defer loading input update = true
