# Packaged OpenNV defaults. Generated campaign profiles copy this once and then
# keep it profile-local, so a user's settings never alter game or mod sources.

[Camera]
field of view = 75
viewing distance = 65536

[Video]
resolution x = 1920
resolution y = 1080
vsync mode = 1

[Input]
always run = true

[Map]
global = true
local map hud fog of war = false

[Saves]
character = OpenNV
